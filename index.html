<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEU Library Visitor Log</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #1a6b2f;
    --green-dark: #0f4520;
    --green-light: #2d9a47;
    --red: #c0392b;
    --gold: #d4a017;
    --gold-light: #f0c030;
    --cream: #faf8f3;
    --warm-white: #ffffff;
    --text-dark: #1a1a1a;
    --text-mid: #4a4a4a;
    --text-light: #7a7a7a;
    --border: #e0dbd0;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-md: 0 8px 32px rgba(0,0,0,0.12);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.16);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* PAGE SYSTEM */
  .page { display: none; min-height: 100vh; }
  .page.active { display: flex; flex-direction: column; }

  /* SHARED HEADER */
  .site-header {
    background: var(--green-dark);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .site-header img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--gold); }
  .site-header .header-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: #fff;
    line-height: 1.2;
  }
  .site-header .header-text p {
    font-size: 0.72rem;
    color: var(--gold-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-right .admin-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.8);
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .header-right .admin-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.6);
    color: #fff;
  }

  /* LANDING PAGE */
  #page-landing {
    background: linear-gradient(160deg, #0f4520 0%, #1a6b2f 40%, #2d9a47 100%);
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }
  #page-landing::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(212,160,23,0.12) 0%, transparent 70%);
    top: -100px; right: -100px;
    border-radius: 50%;
  }
  #page-landing::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
    bottom: -80px; left: -80px;
    border-radius: 50%;
  }

  .landing-card {
    background: #fff;
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%;
    max-width: 460px;
    box-shadow: var(--shadow-lg);
    position: relative;
    z-index: 1;
    animation: slideUp 0.5s ease;
    text-align: center;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .landing-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .landing-logo img {
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 3px solid var(--green);
    box-shadow: 0 4px 16px rgba(26,107,47,0.2);
  }
  .landing-logo h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--green-dark);
    text-align: center;
    line-height: 1.3;
  }
  .landing-logo p {
    font-size: 0.85rem;
    color: var(--text-light);
    text-align: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .role-selection {
    display: flex;
    gap: 16px;
    margin: 32px 0;
  }
  .role-btn {
    flex: 1;
    padding: 24px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .role-btn:hover {
    border-color: var(--green);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }
  .role-btn .role-icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 12px;
  }
  .role-btn .role-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--green-dark);
    margin-bottom: 4px;
  }
  .role-btn .role-desc {
    font-size: 0.8rem;
    color: var(--text-light);
  }

  /* LOGIN PAGE */
  #page-login {
    background: linear-gradient(160deg, #0f4520 0%, #1a6b2f 40%, #2d9a47 100%);
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
  }

  .login-card {
    background: #fff;
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%;
    max-width: 460px;
    box-shadow: var(--shadow-lg);
    position: relative;
    z-index: 1;
    animation: slideUp 0.5s ease;
  }

  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .login-logo img {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 3px solid var(--green);
    box-shadow: 0 4px 16px rgba(26,107,47,0.2);
  }
  .login-logo h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--green-dark);
    text-align: center;
    line-height: 1.3;
  }
  .login-logo p {
    font-size: 0.8rem;
    color: var(--text-light);
    text-align: center;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--text-light);
    cursor: pointer;
    margin-bottom: 20px;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--green); }

  /* Toggle */
  .login-toggle {
    display: flex;
    background: var(--cream);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
    border: 1.5px solid var(--border);
  }
  .toggle-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-light);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .toggle-btn.active {
    background: var(--green);
    color: #fff;
    box-shadow: 0 2px 8px rgba(26,107,47,0.3);
  }
  .toggle-btn svg { width: 16px; height: 16px; }

  /* Form elements */
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text-dark);
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    appearance: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(26,107,47,0.1);
  }
  .form-group input::placeholder { color: #bbb; }

  .rfid-input-wrap {
    position: relative;
  }
  .rfid-input-wrap input {
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.08em;
  }
  .rfid-badge {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    background: var(--gold);
    color: var(--green-dark);
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .employee-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding: 8px 12px;
    background: var(--cream);
    border-radius: 8px;
  }
  .employee-toggle input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--green);
  }
  .employee-toggle label {
    font-size: 0.9rem;
    color: var(--text-mid);
  }

  .purpose-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .purpose-btn {
    padding: 14px 10px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fff;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .purpose-btn .purpose-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
  .purpose-btn .purpose-label { font-size: 0.78rem; font-weight: 600; color: var(--text-mid); }
  .purpose-btn:hover { border-color: var(--green-light); background: #f0f9f2; }
  .purpose-btn.selected {
    border-color: var(--green);
    background: #e8f5eb;
  }
  .purpose-btn.selected .purpose-label { color: var(--green-dark); }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
    margin-top: 8px;
  }
  .btn-primary:hover { background: var(--green-dark); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(26,107,47,0.35); }
  .btn-primary:active { transform: translateY(0); }

  /* WELCOME PAGE */
  #page-welcome {
    background: linear-gradient(160deg, #0f4520 0%, #1a6b2f 50%, #2d9a47 100%);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 24px;
    padding: 40px;
  }
  .welcome-card {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 56px 52px;
    text-align: center;
    max-width: 500px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    animation: welcomePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes welcomePop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .welcome-card img { width: 88px; height: 88px; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 20px; }
  .welcome-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--green-dark);
    margin-bottom: 16px;
  }
  .welcome-card .visitor-name {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 4px;
  }
  .welcome-card .visitor-detail {
    font-size: 0.95rem;
    color: var(--text-light);
    margin-bottom: 6px;
  }
  .welcome-purpose-tag {
    display: inline-block;
    background: var(--gold);
    color: var(--green-dark);
    font-size: 0.85rem;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    margin-top: 12px;
    letter-spacing: 0.04em;
  }
  .welcome-time {
    margin-top: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    color: var(--green);
    font-weight: 500;
  }
  .welcome-date {
    font-size: 0.9rem;
    color: var(--text-light);
    margin-top: 4px;
  }
  .welcome-back-btn {
    margin-top: 28px;
    padding: 12px 32px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .welcome-back-btn:hover { background: var(--green-dark); }

  /* ADMIN LOGIN PAGE */
  #page-admin-login {
    background: var(--cream);
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }
  .admin-login-card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow-md);
    border-top: 4px solid var(--green);
    animation: slideUp 0.4s ease;
  }
  .admin-login-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--green-dark);
    margin-bottom: 6px;
  }
  .admin-login-card p {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 28px;
  }

  /* ADMIN DASHBOARD */
  #page-admin {
    background: var(--cream);
    flex-direction: column;
  }

  .admin-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--green-dark);
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 12px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.88rem;
    font-weight: 500;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.15); color: #fff; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 12px 12px; }

  .sidebar-logout {
    margin-top: auto;
    padding: 0 12px;
  }

  /* Main content */
  .admin-main {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
  }

  .section { display: none; }
  .section.active { display: block; }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--green-dark);
    margin-bottom: 6px;
  }
  .section-sub {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-bottom: 28px;
  }

  /* Filter controls */
  .filter-controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    background: #fff;
    padding: 16px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    margin-bottom: 24px;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-group label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-mid);
    white-space: nowrap;
  }
  .filter-group select, .filter-group input {
    padding: 8px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    outline: none;
  }
  .filter-group input[type="date"] {
    padding: 7px 12px;
  }
  .filter-actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .btn-filter {
    padding: 8px 16px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-filter:hover { background: var(--green-dark); }
  .btn-reset {
    padding: 8px 16px;
    background: var(--cream);
    color: var(--text-mid);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-reset:hover { background: #e8e2d5; }

  /* Stat cards */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--green);
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: '';
    position: absolute;
    right: -20px; top: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: var(--green);
    opacity: 0.06;
  }
  .stat-card.gold { border-left-color: var(--gold); }
  .stat-card.gold::after { background: var(--gold); }
  .stat-card.red { border-left-color: var(--red); }
  .stat-card.red::after { background: var(--red); }
  .stat-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    color: var(--text-dark);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-desc { font-size: 0.78rem; color: var(--text-light); }

  /* College breakdown */
  .college-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
  }
  .college-card {
    background: #fff;
    border-radius: var(--radius-sm);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .college-name { font-size: 0.82rem; font-weight: 600; color: var(--text-mid); max-width: 180px; line-height: 1.4; }
  .college-count {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--green);
    font-weight: 700;
  }

  /* Search & table */
  .search-bar-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .search-bar-wrap svg {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    width: 18px; height: 18px;
    pointer-events: none;
  }
  .search-bar-wrap input {
    width: 100%;
    padding: 13px 16px 13px 46px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    outline: none;
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-bar-wrap input:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(26,107,47,0.1);
  }

  .data-table-wrap {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    min-width: 800px;
  }
  thead {
    background: var(--green-dark);
    color: #fff;
  }
  thead th {
    padding: 14px 18px;
    text-align: left;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f6faf7; }
  tbody td { padding: 13px 18px; color: var(--text-mid); }
  tbody td.name-cell { font-weight: 600; color: var(--text-dark); }

</style>
</head>
<body>

<div id="page-landing" class="page">
  <div class="landing-card">
    <div class="landing-logo">
      <h2>NEU Library</h2>
      <p>Visitor Log System</p>
    </div>
    <div class="role-selection">
      <button class="role-btn" onclick="showPage('page-login')">
